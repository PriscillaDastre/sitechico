<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contato · Chico Marques Corretor de Imóveis em Itajubá/MG</title>
<meta name="description" content="Fale com o Chico Marques para comprar, vender ou alugar imóveis em Itajubá e região. WhatsApp, telefone e e-mail.">
<meta name="theme-color" content="#0E5C4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230E5C4A'/><text x='50' y='68' font-size='46' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle'>CM</text></svg>">
</head>
<body data-page="contato">
<main class="wrap section" id="app"></main>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function(){
  var A = window.App, I = A.ICONS, esc = A.esc, $ = A.$;
  A.mountChrome({ativo:'Contato'}); A.mountFooter(); A.mountWA();
  var C = A.CONFIG;

  $('#app').innerHTML =
    '<nav class="crumb"><a href="index.html">Início</a>' + I.chevR + '<span>Contato</span></nav>' +
    '<div style="text-align:center;max-width:620px;margin:0 auto 46px">' +
      '<span class="eyebrow">Fale comigo</span>' +
      '<h1 style="margin-bottom:16px">Vamos conversar sobre<br>o seu próximo imóvel?</h1>' +
      '<p class="lead" style="margin-inline:auto">Me conta o que você procura — ou o que você quer vender. Respondo no mesmo dia, de segunda a sábado.</p>' +
    '</div>' +

    '<div class="contact-grid">' +
      '<div>' +
        '<div class="form-panel">' +
          '<h3 style="margin-bottom:6px">Envie uma mensagem</h3>' +
          '<p style="color:var(--muted);font-size:.9rem;margin-bottom:22px">Preencha e eu te chamo de volta.</p>' +
          '<form id="cForm" novalidate>' +
            '<div class="form-grid">' +
              '<div class="f"><label for="cNome">Nome<span class="req">*</span></label><input id="cNome" required placeholder="Seu nome"></div>' +
              '<div class="f"><label for="cTel">Telefone / WhatsApp<span class="req">*</span></label><input id="cTel" required inputmode="tel" placeholder="(35) 99999-0000"></div>' +
            '</div>' +
            '<div class="form-grid" style="margin-top:18px">' +
              '<div class="f"><label for="cFim">Tenho interesse em</label><select id="cFim">' +
                '<option>Comprar</option><option>Alugar</option><option>Vender meu imóvel</option><option>Indicar alguém</option><option>Outro assunto</option></select></div>' +
              '<div class="f"><label for="cBairro">Bairro / cidade</label><input id="cBairro" list="dlB" placeholder="Centro, Itajubá">' +
                '<datalist id="dlB">' + A.faceis().bairros.slice(0,40).map(function(b){return '<option value="'+esc(b)+'">';}).join('') + '</datalist></div>' +
            '</div>' +
            '<div class="f wide" style="margin-top:18px"><label for="cMsg">Mensagem<span class="req">*</span></label>' +
              '<textarea id="cMsg" required rows="5" placeholder="Ex.: procuro casa de 3 quartos no Pinheirinho, até R$ 1,2 mi, com quintal."></textarea></div>' +
            '<button class="btn btn-primary btn-block" type="submit" style="margin-top:20px" id="cSend">' + I.wa + 'Enviar pelo WhatsApp</button>' +
            '<p style="font-size:.78rem;color:var(--muted);margin-top:12px;text-align:center">Ao enviar, o WhatsApp abre com a mensagem já escrita. Nada é gravado neste site.</p>' +
          '</form>' +
        '</div>' +

        '<div class="contact-cards">' +
          '<a class="c-card" href="https://wa.me/' + C.foneLink + '" target="_blank" rel="noopener">' +
            '<span class="ico">' + I.wa + '</span><div><b>WhatsApp</b><span>' + esc(C.fone) + '</span></div></a>' +
          '<a class="c-card" href="tel:+' + C.foneLink + '">' +
            '<span class="ico">' + I.phone + '</span><div><b>Telefone</b><span>' + esc(C.fone) + '</span></div></a>' +
          '<a class="c-card" href="mailto:' + C.email + '">' +
            '<span class="ico">' + I.mail + '</span><div><b>E-mail</b><span>' + esc(C.email) + '</span></div></a>' +
          '<div class="c-card"><span class="ico">' + I.pin + '</span><div><b>Área de atuação</b>' +
            '<span>' + esc(C.cidade) + '/' + esc(C.uf) + ' e cidades vizinhas</span></div></div>' +
        '</div>' +
      '</div>' +

      '<aside style="display:grid;gap:16px">' +
        '<div class="side-card dark">' +
          '<div class="side-agent" style="justify-content:center;text-align:center;flex-direction:column;gap:0">' +
            '<span class="agent-av" style="margin-bottom:11px">CM</span>' +
            '<div><b>' + esc(C.nome) + '</b><span>Corretor de imóveis</span></div>' +
          '</div>' +
          '<div class="side-info" style="color:#93A8A3;justify-items:center">' +
            '<div>' + I.clock + '<span>Seg a sex, 9h às 18h<br>Sáb, 9h às 13h</span></div>' +
          '</div>' +
          '<a class="btn btn-gold btn-block" href="https://wa.me/' + C.foneLink + '" target="_blank" rel="noopener">' + I.wa + 'Chamar agora</a>' +
        '</div>' +
        '<div class="side-card">' +
          '<h3 style="margin-bottom:14px;font-size:1rem">Atendimento</h3>' +
          '<div class="side-info">' +
            '<div>' + I.clock + '<span>Resposta no mesmo dia útil</span></div>' +
            '<div>' + I.home + '<span>Visitas agendadas com hora marcada</span></div>' +
            '<div>' + I.scale + '<span>Avaliação gratuita do imóvel</span></div>' +
            '<div>' + I.key + '<span>Acompanhamento de financiamento</span></div>' +
          '</div>' +
          '<a class="btn btn-ghost btn-block" href="corretor.html">' + I.lock + 'Quero anunciar meu imóvel</a>' +
        '</div>' +
      '</aside>' +
    '</div>';

  $('#cForm').addEventListener('submit', function(e){
    e.preventDefault();
    var n = $('#cNome').value.trim(), t = $('#cTel').value.trim(), m = $('#cMsg').value.trim();
    if(!n || !t || !m){ A.toast('Preencha nome, telefone e mensagem.','err'); return; }
    var b = $('#cBairro').value.trim(), f = $('#cFim').value;
    var texto = 'Olá ' + C.nome + '! Meu nome é ' + n + ' (' + t + ').\n\n' +
      f + (b ? ' — ' + b : '') + '\n\n' + m;
    window.open(A.fmt.wa(texto), '_blank');
    A.toast('Abrindo o WhatsApp com sua mensagem.');
  });
})();
</script>
</body>
</html>
